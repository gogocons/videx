<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="640"
     viewBox="0 0 1280 640">

  <rect width="1280" height="640" fill="#101217"/>

  <!-- Videx play icon -->
  <rect x="140" y="165" width="112" height="112"
        rx="24" fill="#d93636"/>

  <!-- Centered play symbol with rounded corners -->
  <path d="M179 197 L179 245 L220 221 Z"
        fill="#e9edf4"
        stroke="#e9edf4"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Project name -->
  <text x="280" y="251"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="96" font-weight="700"
        fill="#e9edf4">Videx</text>

  <!-- Tagline -->
  <text x="140" y="365"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="38"
        fill="#aab3c2">Your videos. Your library.</text>

  <!-- Description -->
  <text x="140" y="430"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25"
        fill="#7f8a9b">Offline-first video bookmarking</text>

  <!-- Subtle decorative accent -->
  <rect x="140" y="480" width="100" height="5"
        rx="2.5" fill="#d93636"/>

</svg>
